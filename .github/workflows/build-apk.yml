name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cd launcher && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: gh release create apk-latest launcher/app/build/outputs/apk/release/*.apk --title "Glass TV APK" --notes "Build"
        env:
          GH_TOKEN: ${{ github.token }}
